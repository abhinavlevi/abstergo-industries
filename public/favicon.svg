<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081C36" />
      <stop offset="100%" stop-color="#030914" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)" stroke="#1E3A8A" stroke-width="2" />
  <!-- Penrose-style Abstergo triangle in crisp white/silver -->
  <g transform="translate(16, 20) scale(0.75)" filter="url(#glow)">
    <!-- Top-left arm -->
    <polygon points="64,12 18,92 42,92 76,32" fill="#F8FAFC" />
    <!-- Bottom arm -->
    <polygon points="18,92 110,92 98,72 38,72" fill="#CBD5E1" />
    <!-- Right arm -->
    <polygon points="110,92 64,12 52,32 86,92" fill="#94A3B8" />
    <!-- Clearance accent marker -->
    <polygon points="64,48 54,66 74,66" fill="#C8381A" />
  </g>
</svg>